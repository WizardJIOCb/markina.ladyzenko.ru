server {
    listen 80;
    listen [::]:80;
    server_name markina.ladyzenko.ru;
    root /var/www/markina.ladyzenko.ru/public;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://markina.ladyzenko.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name markina.ladyzenko.ru;

    root /var/www/markina.ladyzenko.ru/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/markina.ladyzenko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markina.ladyzenko.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache";

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    access_log /var/log/nginx/markina.ladyzenko.ru.access.log;
    error_log /var/log/nginx/markina.ladyzenko.ru.error.log;
}
