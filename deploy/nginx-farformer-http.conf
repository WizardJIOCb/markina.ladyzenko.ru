# Certificate bootstrap and permanent HTTP alias.
server {
    listen 80;
    listen [::]:80;
    server_name farformer.ru www.farformer.ru;
    root /var/www/markinai.ru/public;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://markinai.ru$request_uri; }
    access_log /var/log/nginx/farformer.ru.access.log;
    error_log /var/log/nginx/farformer.ru.error.log;
}
