# Initial configuration for the first certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name markinai.ru www.markinai.ru;
    root /var/www/markinai.ru/public;
    index index.html;

    # Temporary HTTP staging: do not expose sign-in before HTTPS is active.
    location = /admin { return 503; }
    location /admin/ { return 503; }
    location = /api/content {
        proxy_pass http://127.0.0.1:8322;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 503; }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8322;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    access_log /var/log/nginx/markinai.ru.access.log;
    error_log /var/log/nginx/markinai.ru.error.log;
}
