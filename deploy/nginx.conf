server {
    listen 80;
    listen [::]:80;
    server_name markinai.ru www.markinai.ru;
    root /var/www/markinai.ru/public;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://markinai.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name markinai.ru;

    root /var/www/markinai.ru/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/markinai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markinai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache";

    error_page 404 /404.html;

    client_max_body_size 13m;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8322;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8322;
        proxy_set_header Host $host;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }

    location / { try_files $uri $uri/ =404; }
    location = /old { return 301 /old/; }
    location = /new { return 301 /; }
    location /new/ {
        rewrite ^/new/(.*)$ /$1 permanent;
    }
    location ~ /\. { deny all; }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    access_log /var/log/nginx/markinai.ru.access.log;
    error_log /var/log/nginx/markinai.ru.error.log;
}

# Both certificate names are covered, but only the apex is canonical.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.markinai.ru;
    ssl_certificate /etc/letsencrypt/live/markinai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markinai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://markinai.ru$request_uri;
}
