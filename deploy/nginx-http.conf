# Initial configuration for the first certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name markina.ladyzenko.ru;
    root /var/www/markina.ladyzenko.ru/public;
    index index.html;

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    access_log /var/log/nginx/markina.ladyzenko.ru.access.log;
    error_log /var/log/nginx/markina.ladyzenko.ru.error.log;
}
